# This workflow installs the node dependencies and runs the tests across
# several node versions.
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn
      # The repository ships a yarn.lock, so install with yarn to honour it.
      - run: yarn install --frozen-lockfile
      # Fails the build if any file drops below 100% coverage.
      - run: yarn test:coverage
